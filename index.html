<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymer Chatroom</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .chat-container {
            width: 450px;
            height: 650px;
            background-color: #2a2b36;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background-color: #007acc;
            color: white;
            padding: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 1.1em;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Styling für die einzelnen Chat-Nachrichten */
        .message {
            background-color: #3a3b45;
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 75%;
            word-wrap: break-word;
            align-self: flex-start;
        }

        .chat-input-area {
            display: flex;
            padding: 15px;
            background-color: #20212c;
            gap: 10px;
        }

        input {
            flex: 1;
            background-color: #3a3b45;
            border: none;
            border-radius: 6px;
            padding: 12px;
            color: white;
            outline: none;
            font-size: 1em;
        }

        input::placeholder {
            color: #8a8b95;
        }

        button {
            background-color: #007acc;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 0 25px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #005999;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Anonymer Chatroom (Verbunden)</div>
        <div class="chat-messages" id="messages">
            <!-- Hier erscheinen die Nachrichten -->
        </div>
        <form class="chat-input-area" id="chat-form">
            <input type="text" id="chat-input" placeholder="Nachricht eingeben..." autocomplete="off">
            <button type="submit">Senden</button>
        </form>
    </div>

    <!-- Verbindung zum Server herstellen -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const form = document.getElementById('chat-form');
        const input = document.getElementById('chat-input');
        const messagesContainer = document.getElementById('messages');

        // Nachricht absenden
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (input.value.trim() !== '') {
                socket.emit('chat message', input.value);
                input.value = '';
            }
        });

        // Nachricht empfangen und im Fenster anzeigen
        socket.on('chat message', (msg) => {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message');
            messageElement.textContent = msg;
            messagesContainer.appendChild(messageElement);
            
            // Automatisch nach unten scrollen bei neuen Nachrichten
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>
</body>
</html>
